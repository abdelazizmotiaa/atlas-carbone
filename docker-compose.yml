version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas_carbone_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=change_me_in_production_jwt_secret_atlas_carbone
      - TZ=Africa/Casablanca
    volumes:
      - atlas_carbone_data:/app/server/data
      - atlas_carbone_uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  atlas_carbone_data:
    driver: local
  atlas_carbone_uploads:
    driver: local
